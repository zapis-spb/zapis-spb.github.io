<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Кабинет · ProМойка</title>
<meta name="theme-color" content="#0E1014">
<!-- страница уже тёмная: браузеры с «тёмным режимом» (Samsung Internet, Chrome) не должны её перекрашивать -->
<meta name="color-scheme" content="dark">
<meta name="darkreader-lock">
<link rel="manifest" id="mf" href="manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Кабинет">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
@media (prefers-color-scheme: dark){:root{color-scheme:dark}}
:root{color-scheme:dark;
  --bg:#0E1014; --bg2:#15181E; --card:#1A1E25; --line:#262B34; --text:#F2F4F7; --muted:#9AA3B2; --dim:#6B7380;
  --accent:#4F8CFF; --accent-ink:#fff; --ok:#3DD68C; --warn:#F5B84B; --danger:#FF6B6B;
  --r:16px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px); --row:38px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100dvh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding-bottom:calc(84px + var(--safe-b))}
.demo-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 16px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--accent) 14%,#14171C);border-bottom:1px solid color-mix(in srgb,var(--accent) 25%,var(--line))}
.demo-bar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo-bar a{flex:0 0 auto;color:var(--text);font-weight:700}
.top{position:sticky;top:0;z-index:15;background:rgba(14,16,20,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(10px + var(--safe-t)) 16px 10px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
.sync{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px;margin-top:2px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.sync.off i{background:var(--danger)}
.offline{margin:10px 16px 0;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--danger) 12%,var(--card));border:1px solid color-mix(in srgb,var(--danger) 40%,var(--line));font-size:13px}
.pad{padding:0 16px}
.h2{font-size:17px;font-weight:800;margin:20px 0 10px}
.muted{color:var(--muted)}
.small{font-size:12px;color:var(--dim)}

/* дни */
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 16px 4px}
.days::-webkit-scrollbar{display:none}
.day{position:relative;flex:0 0 auto;width:56px;padding:8px 0;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:center}
.day .w{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
.day .d{font-size:18px;font-weight:800;margin-top:1px}
.day .c{font-size:11px;color:var(--dim);font-weight:700;height:15px}
.day.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day.on .w,.day.on .c{color:inherit;opacity:.9}
.day.off .d{opacity:.4}
.day .nw{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kpi .v{font-size:18px;font-weight:800}
.kpi .k{font-size:12px;color:var(--muted)}

/* сетка дня */
.grid-wrap{margin:8px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.grid{display:grid;grid-template-columns:46px repeat(var(--n),minmax(118px,1fr));min-width:100%}
.gh{position:sticky;top:0;z-index:2;padding:10px 6px;font-size:12px;font-weight:800;color:var(--muted);text-align:center;border-bottom:1px solid var(--line);background:var(--card)}
.gt{position:relative;border-right:1px solid var(--line)}
.gt span{position:absolute;left:0;right:6px;text-align:right;font-size:11px;color:var(--dim);transform:translateY(-50%)}
.col{position:relative;border-right:1px solid var(--line);cursor:copy;
  background-image:repeating-linear-gradient(180deg,transparent 0,transparent calc(var(--row)*2 - 1px),var(--line) calc(var(--row)*2 - 1px),var(--line) calc(var(--row)*2)),
                   repeating-linear-gradient(180deg,transparent 0,transparent calc(var(--row) - 1px),rgba(255,255,255,.035) calc(var(--row) - 1px),rgba(255,255,255,.035) var(--row))}
.col:last-child{border-right:0}
.col.closed{background-color:rgba(0,0,0,.25)}
.bk{position:absolute;left:3px;right:3px;border-radius:10px;padding:5px 8px;font-size:12px;line-height:1.3;overflow:hidden;cursor:pointer;
  background:color-mix(in srgb,var(--accent) 26%,var(--bg2));border:1px solid color-mix(in srgb,var(--accent) 60%,transparent)}
.bk b{display:block;font-size:12px;font-weight:800}
.bk .x{color:#d6dbe3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk.manual{background:#2A303A;border-color:#3A414D}
.bk.new{background:color-mix(in srgb,var(--warn) 18%,var(--bg2));border-color:var(--warn)}
.bk.done{opacity:.55}
.bk.noshow{opacity:.55;border-style:dashed;border-color:var(--danger)}
.bk.block{background:repeating-linear-gradient(135deg,#1f232b 0 8px,#252a33 8px 16px);border-color:#3A414D;color:var(--muted)}
.bk .tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.04em;padding:1px 6px;border-radius:6px;background:var(--warn);color:#1a1300;margin-bottom:2px}
.now-line{position:absolute;left:46px;right:0;height:2px;background:var(--danger);z-index:3;pointer-events:none}
.now-line::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--danger)}
.closed-card{margin:12px 16px;padding:22px;text-align:center;background:var(--card);border:1px dashed var(--line);border-radius:var(--r);color:var(--muted)}
.hint{margin:8px 16px 0;font-size:12px;color:var(--dim)}

/* карточки и списки */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 16px 10px}
.card .t{font-weight:800;font-size:16px}
.card .s{color:var(--muted);font-size:13px;margin-top:3px}
.card .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip-st{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;margin-top:8px}
.st-new{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.st-confirmed{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.st-done{background:#2A303A;color:var(--muted)}
.st-noshow,.st-cancelled{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.btn{flex:1;min-width:120px;height:46px;border-radius:13px;background:var(--bg2);border:1px solid var(--line);font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 12px}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.okb{background:color-mix(in srgb,var(--ok) 18%,var(--bg2));border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.btn.dan{color:var(--danger)}
.btn[disabled]{opacity:.45}
.empty{margin:12px 16px;padding:26px 18px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}

/* нижнее меню */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(21,24,30,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b));display:flex;justify-content:center}
.nav .in{display:flex;width:100%;max-width:720px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:700;color:var(--dim);position:relative}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--text)}
.nav .bdg{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.nav .bdg[hidden]{display:none}
.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(84px + var(--safe-b));z-index:19;width:58px;height:58px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 10px 30px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
.fab svg{width:26px;height:26px}

/* окно снизу */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:94dvh;display:flex;flex-direction:column;background:var(--bg2);border-radius:22px 22px 0 0;transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:720px;margin:0 auto;border-top:1px solid var(--line)}
.sheet.on{transform:none}
.sh-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.sh-head h2{font-size:18px;margin:0;flex:1;font-weight:800}
.icon-btn{width:36px;height:36px;border-radius:12px;background:var(--card);display:grid;place-items:center;border:1px solid var(--line);flex:0 0 36px}
.icon-btn svg{width:18px;height:18px}
.sh-body{overflow-y:auto;padding:4px 16px 16px;flex:1}
.sh-foot{padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.rows{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin-bottom:12px}
.rows .r{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.rows .r:last-child{border-bottom:0}
.rows .r>span:first-child{color:var(--muted);flex:0 0 auto}
.rows .r>span:last-child{text-align:right}
.call{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:16px;background:var(--ok);color:#06210f;font-weight:800;font-size:17px;margin-bottom:12px}
.call svg{width:22px;height:22px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 13px;font-size:16px;outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:4px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;padding:9px 10px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--text);color:var(--bg)}
.svc-pick{background:var(--card);border:1px solid var(--line);border-radius:13px;max-height:240px;overflow-y:auto;margin-bottom:12px}
.svc-pick .cat{font-size:12px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;padding:10px 12px 4px}
.svc-pick label{display:flex;gap:10px;align-items:center;padding:9px 12px;font-size:14px;border-top:1px solid var(--line)}
.svc-pick label span{flex:1}
.svc-pick input{width:20px;height:20px;accent-color:var(--accent)}
.err-box{background:color-mix(in srgb,var(--danger) 12%,var(--card));border:1px solid color-mix(in srgb,var(--danger) 40%,var(--line));border-radius:13px;padding:10px 13px;font-size:14px;margin-bottom:12px}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.time{padding:10px 0;border-radius:11px;background:var(--card);border:1px solid var(--line);text-align:center;font-weight:700;font-size:14px}
.time.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.time[disabled]{opacity:.25;text-decoration:line-through}

/* цены и настройки */
.cat-h{display:flex;gap:8px;align-items:center;margin:18px 16px 8px}
.cat-h input{flex:1;background:transparent;border:1px solid transparent;border-radius:10px;padding:6px 8px;font-size:17px;font-weight:800;margin-left:-8px}
.cat-h input:focus{border-color:var(--line);background:var(--card);outline:none}
.pe{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:0 16px 8px}
.pe.hid{opacity:.55}
.pe .nm{width:100%;background:transparent;border:1px solid transparent;border-radius:9px;padding:5px 6px;margin-left:-6px;font-weight:700;font-size:15px}
.pe .nm:focus{border-color:var(--line);background:var(--bg2);outline:none}
.pe .ln{display:flex;gap:8px;align-items:center;margin-top:6px}
.pe .ln input,.pe .ln select{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px}
.pe .pr{width:96px;text-align:right;font-weight:800}
.pe .du{flex:1;min-width:0}
.pe .tg{flex:0 0 auto;height:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted)}
.pe .tg.on{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.pe .del{flex:0 0 38px;height:38px;border-radius:10px;border:1px solid var(--line);color:var(--danger);display:grid;place-items:center}
.pe .del svg{width:16px;height:16px}
.pe .mode{width:100%;min-height:36px;margin-top:6px;border-radius:10px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);padding:0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.pe .mode b{color:var(--ok);font-weight:800}
.pe .mode.phone-only{border-color:color-mix(in srgb,#F5A524 45%,var(--line))}
.pe .mode.phone-only b{color:#F5A524}
.pe .mode .chg{color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap}
.add-row{margin:0 16px 8px;width:calc(100% - 32px);height:44px;border-radius:13px;border:1px dashed var(--line);color:var(--muted);font-weight:700}
.savebar{position:fixed;left:0;right:0;bottom:calc(66px + var(--safe-b));z-index:18;padding:10px 16px;display:flex;justify-content:center;pointer-events:none}
.savebar .in{display:flex;gap:8px;width:100%;max-width:688px;pointer-events:auto;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.set{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:0 16px 12px;padding:14px}
.set h3{margin:0 0 4px;font-size:16px;font-weight:800}
.set p{margin:0 0 10px;font-size:13px;color:var(--muted)}
.sw{position:relative;width:50px;height:30px;flex:0 0 50px;border-radius:15px;background:var(--line);transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}
.sw.on::after{left:23px}
.line{display:flex;align-items:center;gap:10px}
.line .grow{flex:1}
.hrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow .dn{flex:0 0 34px;font-weight:800}
.hrow select{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:7px 6px;font-size:15px}
.hrow .cl{color:var(--dim);font-size:14px;flex:1}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:22px;font-weight:800}
.stepper b{font-size:22px;min-width:24px;text-align:center}
.doff{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.doff span{display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 11px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:13px;font-weight:700}
.doff button{width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center}
.doff button svg{width:12px;height:12px}
.howto{margin:0;padding-left:20px;font-size:14px}
.howto li{margin:6px 0}
.toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translate(-50%,calc(-100% - 60px));background:var(--card);border:1px solid var(--line);padding:11px 16px;border-radius:13px;z-index:50;font-size:14px;font-weight:600;transition:transform .3s;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.on{transform:translate(-50%,0)}
.toast.newb{border-color:var(--warn)}
.login{max-width:420px;margin:0 auto;padding:22vh 24px 0;text-align:center}
.login h1{font-size:24px;margin:0 0 10px}
.login p{color:var(--muted)}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<script>
// Демо-сервер внутри браузера: отвечает на те же запросы /api/<мойка>/..., что настоящий server/app.py.
// Встраивается только в демо-сборку (build.py без --live). Данные лежат в localStorage этого браузера,
// поэтому страница записи и кабинет владельца видят одни и те же записи. Логика повторяет app.py:

    if (['date', 'start', 'dur', 'box'].some(k => k in body)) {

      const box = 'box' in body ? body.box : b.box;
      if (!isInt(start) || start < 0 || start >= 1440 || !isInt(dur) || dur < 15 || dur > 1440 || start + dur > 1440) throw new ApiError(400, 'bad_time', 'Проверьте время');
      if (box !== null && (!isInt(box) || box < 0 || box >= cfg.boxes)) throw new ApiError(400, 'bad_box');
      if (box === null && b.kind !== 'block') throw new ApiError(400, 'bad_box', 'Выберите бокс');
      const occ = occupied(st, d, b.id), boxes = box === null ? [...Array(cfg.boxes).keys()] : [box];
      if (boxes.some(x => !boxFree(occ, x, start, dur)) && !body.force) throw new ApiError(409, 'overlap', 'На это время уже есть запись');
      Object.assign(sets, { date: d, start, dur, box });
    }
    for (const [f, ml] of [['name', 60], ['car', 80], ['comment', 500]]) if (f in body) sets[f] = clean(body[f], ml, f);
    if ('phone' in body) sets.phone = normPhone(body.phone, false);
    if ('total' in body) { if (!isInt(body.total) || body.total < 0) throw new ApiError(400, 'bad_total'); sets.total = body.total; }

    Object.assign(b, sets, { seen: 1, updated_at: now.iso }); save();
    return ownerView(b);
  }
  if (path === 'owner/seen' && method === 'POST') {
    (body.ids || []).forEach(id => { const b = st.bookings.find(x => x.id === id); if (b) b.seen = 1; });

    if ('hours' in body) {
      const h = {};

      const seen = new Set();

}

function rng(seedStr) {
  let h = 1779033703 ^ seedStr.length;
  for (let i = 0; i < seedStr.length; i++) { h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
}
function seedState(cfg, startId) {
  const now = nowMsk(), r = rng(SLUG + VER + now.date), B = [];
  let id = startId;
  const pickOne = a => a[Math.floor(r() * a.length)];
  const NAMES = ['Алексей', 'Мария', 'Дмитрий', 'Ольга', 'Сергей', 'Анна', 'Игорь', 'Екатерина', 'Павел', 'Наталья', 'Артём', 'Виктор', 'Юлия', 'Максим', 'Илья', 'Светлана'];
  const CARS = ['Kia Rio, белый', 'Hyundai Solaris, серый', 'Toyota Camry, чёрный', 'VW Polo, синий', 'Skoda Octavia, белый', 'BMW X5, чёрный',
                'Haval Jolion, серый', 'Lada Vesta, белая', 'Mercedes E, чёрный', 'Chery Tiggo 7, красный', 'Geely Monjaro, белый', 'Kia Sportage, серый'];
  const phone = () => `+7 (900) ${100 + Math.floor(r() * 899)}-${String(10 + Math.floor(r() * 89))}-${String(10 + Math.floor(r() * 89))}`;
  const all = []; cfg.categories.forEach(c => c.services.forEach(s => { if (!s.hidden) all.push(s); }));
  const pool = all.filter(s => !s.call && s.dur !== 'days' && s.dur >= 30 && s.dur <= 180);
  const main = pool.slice(0, Math.max(3, Math.ceil(pool.length / 3)));         // первые позиции прайса — самые ходовые
  const longOne = all.find(s => s.dur === 'days' && !s.call);
  if (pool.length) {
    for (let d = -1; d <= 6; d++) {
      const k = addDays(now.date, d), hh = dayHours(cfg, k);
      if (!hh) continue;
      const load = d < 0 ? 0.6 : d === 0 ? 0.55 : Math.max(0.15, 0.5 - d * 0.06);   // ближайшие дни заняты плотнее
      for (let box = 0; box < cfg.boxes; box++) {
        let t = hh[0] + STEP * Math.floor(r() * 3);
        while (t < hh[1] - 30) {
          if (r() < load) {
            const s = r() < 0.75 ? pickOne(main) : pickOne(pool);
            const dur = Math.ceil(s.dur / STEP) * STEP;
            if (t + dur > hh[1]) break;
            const past = k < now.date || (k === now.date && t + dur <= now.min);
            const online = r() < 0.6;
            B.push({ id: id++, kind: online ? 'online' : 'manual', status: past ? (r() < 0.93 ? 'done' : 'noshow') : 'confirmed',
              date: k, start: t, dur, box, services: snap([s]), total: s.price, name: pickOne(NAMES), phone: phone(), car: pickOne(CARS),
              comment: r() < 0.12 ? pickOne(['Сильно грязный салон', 'Есть собака, шерсть', 'Буду к открытию', 'Нужна безналичная оплата']) : '',
              token: token(), seen: 1, created_at: now.iso, updated_at: now.iso });
            t += dur + STEP * Math.floor(r() * 2);
          } else t += STEP * (1 + Math.floor(r() * 2));
        }
      }
    }
  }
  // пара свежих онлайн-записей, которые владелец ещё не видел
  B.filter(b => b.kind === 'online' && b.status === 'confirmed').slice(-2).forEach(b => { b.seen = 0; });
  // заявка на долгую работу — ждёт звонка администратора
  if (longOne) B.push({ id: id++, kind: 'request', status: 'new', date: addDays(now.date, 2), start: null, dur: null, box: null,
    services: snap([longOne]), total: longOne.price, name: 'Роман', phone: phone(), car: 'Audi Q7, белый', comment: 'Подскажите по срокам',
    token: token(), seen: 0, created_at: now.iso, updated_at: now.iso });
  return { cfg, bookings: B, next: id };
}
const ownerView = b => { const o = clone(b); delete o.token; delete o.idem; delete o.u; return o; };

// ---------- подмена fetch ----------
const realFetch = window.fetch.bind(window);
const rx = new RegExp('/api/' + SLUG + '/(.+)$');
window.fetch = async (input, init = {}) => {
  const url = new URL(typeof input === 'string' ? input : input.url, location.href);
  const m = url.pathname.match(rx);
  if (!m) return realFetch(input, init);
  await new Promise(res => setTimeout(res, 120 + Math.random() * 150));
  let body = {};
  try { body = init.body ? JSON.parse(init.body) : {}; } catch (e) {}

};

    S.tab = b.dataset.tab; render(); window.scrollTo(0,0);
  });
  const fab = $('#fab'); if (fab) fab.onclick = () => openAdd({date:S.date});
  refreshView(true);
}
function refreshView(full){
  if (!S.auth || !$('#view')) return;
  const sync = $('#sync');
  if (sync){ sync.className = 'sync' + (S.online ? '' : ' off');
    sync.innerHTML = `<i></i>${S.lastOk ? (S.online ? 'Обновлено в ' : 'Нет связи · данные на ') + S.lastOk.toTimeString().slice(0,5) : 'Загрузка…'}`; }
  $('#off').innerHTML = S.online ? '' : `<div class="offline">Нет связи с сервером. Записи не потеряются — обновим, как только появится интернет.</div>`;
  updateBadges();
  // цены и настройки не перерисовываем сами, чтобы не сбить то, что владелец сейчас вводит
  const v = $('#view');
  if (!full && (S.tab==='price' || S.tab==='set') && v.dataset.ready) return;
  if (!S.data || !S.cfg){ v.innerHTML = `<div class="empty"><span class="spin"></span>&nbsp; Загружаем записи…</div>`; return; }
  if (S.tab==='day') dayView(v);
  else if (S.tab==='req') reqView(v);
  else if (S.tab==='price') priceView(v);
  else setView(v);
  v.dataset.ready = '1';
}
function updateBadges(){
  const unseenDay = allB().filter(b => !b.seen && b.kind==='online' && b.status!=='cancelled').length;
  const req = pending().length;
  const set = (id, n) => { const e = $('#bdg-'+id); if (e){ e.hidden = !n; e.textContent = n; } };
  set('day', unseenDay); set('req', req);
  const n = S.data ? S.data.unseen : 0;
  document.title = (n ? `(${n}) ` : '') + 'Кабинет · ' + D.name;
}

// ---------- расписание ----------
function dayView(v){
  const k = S.date, t = today(), cfg = S.cfg, n = cfg.boxes;
  const items = S.data.bookings.filter(b => b.date===k && b.start!=null && b.dur);
  const act = items.filter(b => b.status!=='cancelled');
  const hh = dayHours(k);
  let g0 = hh ? hh[0] : 9*60, g1 = hh ? hh[1] : 21*60;
  act.forEach(b => { g0 = Math.min(g0, b.start); g1 = Math.max(g1, b.start + b.dur); });
  g0 = Math.floor(g0/30)*30; g1 = Math.ceil(g1/30)*30;
  const real = act.filter(b => b.kind!=='block');
  const sum = real.filter(b => b.status!=='noshow').reduce((a,b)=>a+b.total, 0);
  const busy = real.reduce((a,b)=>a+b.dur, 0);
  const load = hh ? Math.min(100, Math.round(busy / ((hh[1]-hh[0]) * n) * 100)) : 0;
  const days = [...Array(16)].map((_,i)=>addDays(t, i-1));
  const cnt = d => S.data.bookings.filter(b => b.date===d && b.status!=='cancelled' && b.kind!=='block').length;
  const nw = d => S.data.bookings.some(b => b.date===d && !b.seen && b.kind==='online' && b.status!=='cancelled');
  let html = `<div class="days" id="days">${days.map(d=>{ const dd=dobj(d); const c=cnt(d); return `<button class="day ${d===k?'on':''} ${dayHours(d)?'':'off'}" data-d="${d}">${nw(d)?'<i class="nw"></i>':''}<div class="w">${d===t?'Сег':d===addDays(t,-1)?'Вчера':DOW_RU[dd.getDay()]}</div><div class="d">${dd.getDate()}</div><div class="c">${c||''}</div></button>`; }).join('')}</div>
    <div class="kpis"><div class="kpi"><div class="v">${real.length}</div><div class="k">${plural(real.length,'запись','записи','записей')}</div></div>
    <div class="kpi"><div class="v">${hh ? load+'%' : '—'}</div><div class="k">загрузка</div></div>
    <div class="kpi"><div class="v">${rub(sum)}</div><div class="k">по записям</div></div></div>`;
  if (!hh && !act.length){
    const off = (cfg.daysOff||[]).includes(k);
    html += `<div class="closed-card"><b>Выходной</b><br>${off ? 'Этот день отмечен как выходной.' : 'По графику работы мойка в этот день закрыта.'}<br><br>
      ${off ? `<button class="btn" id="openDay">Сделать рабочим днём</button>` : `<button class="btn" id="goSet">Изменить часы работы</button>`}</div>`;
  } else {
    const H = (g1 - g0) / 30 * ROW;
    const lbl = []; for (let m = Math.ceil(g0/60)*60; m <= g1; m += 60) lbl.push(m);
    html += `<div class="grid-wrap"><div class="grid" style="--n:${n}">
      <div class="gh"></div>${[...Array(n)].map((_,i)=>`<div class="gh">Бокс ${i+1}</div>`).join('')}
      <div class="gt" style="height:${H}px">${lbl.map(m=>`<span style="top:${(m-g0)/30*ROW}px${m===g0?';transform:none;top:3px':''}">${m<g1?hm(m):''}</span>`).join('')}</div>
      ${[...Array(n)].map((_,bx)=>`<div class="col ${hh?'':'closed'}" data-box="${bx}" style="height:${H}px">${act.filter(b => b.box===bx || b.box==null).map(b => blockHtml(b, g0)).join('')}</div>`).join('')}
    </div></div>
    <div class="hint">Нажмите на свободное место, чтобы добавить запись или закрыть время. Нажмите на запись, чтобы позвонить, перенести или отменить.</div>`;
  }
  const canc = items.filter(b => b.status==='cancelled' && b.kind!=='block');
  if (canc.length) html += `<div class="h2 pad">Отменённые</div>` + canc.map(b => `<div class="card" data-open="${b.id}"><div class="t">${hm(b.start)} · ${esc(svcNames(b) || b.name || 'Запись')}</div><div class="s">${esc(b.name)}${b.phone ? ' · ' + esc(b.phone) : ''}</div></div>`).join('');
  v.innerHTML = html;
  // линия «сейчас»
  if (k === t && hh !== undefined){
    const nm = nowMin(), wrap = v.querySelector('.grid');
    if (wrap && nm >= g0 && nm <= g1){ const ln = document.createElement('div'); ln.className = 'now-line'; ln.style.top = (v.querySelector('.gh').offsetHeight + (nm - g0)/30*ROW) + 'px'; wrap.style.position = 'relative'; wrap.append(ln); }
  }
  const strip = $('#days'); const on = strip.querySelector('.day.on'); if (on) strip.scrollLeft = on.offsetLeft - 16 - 56;
  strip.querySelectorAll('.day').forEach(b => b.onclick = () => { S.date = b.dataset.d; refreshView(); });
  v.querySelectorAll('.col').forEach(col => col.addEventListener('click', e => {
    if (e.target.closest('.bk')) return;
    const r = col.getBoundingClientRect(); const m = g0 + Math.floor((e.clientY - r.top) / ROW) * 30;
    openAdd({date:k, start:m, box:+col.dataset.box});
  }));
  v.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); openBooking(+el.dataset.open); }));
  const od = $('#openDay'); if (od) od.onclick = async () => { const r = await api('/config', {method:'PUT', body:{daysOff:(cfg.daysOff||[]).filter(x=>x!==k)}}); if (r.ok){ S.cfg = r.data; toast('День снова рабочий'); refreshView(); } else toast(r.data.message||'Не получилось'); };
  const gs = $('#goSet'); if (gs) gs.onclick = () => { S.tab='set'; render(); };
}
function blockHtml(b, g0){
  const top = (b.start - g0) / 30 * ROW + 1, h = Math.max(b.dur / 30 * ROW - 3, 24);
  const cls = b.kind==='block' ? 'block' : b.status==='new' ? 'new' : b.status==='done' ? 'done' : b.status==='noshow' ? 'noshow' : b.kind==='manual' ? 'manual' : '';
  const time = `${hm(b.start)}–${hm(b.start + b.dur)}`;
  if (b.kind==='block') return `<div class="bk block" data-open="${b.id}" style="top:${top}px;height:${h}px"><b>${time}</b><div class="x">Закрыто${b.comment?' · '+esc(b.comment):''}${b.box==null?' · все боксы':''}</div></div>`;
  const tag = !b.seen && b.kind==='online' ? '<span class="tag">НОВАЯ</span>' : b.status==='new' ? '<span class="tag">ПОДТВЕРДИТЬ</span>' : '';
  return `<div class="bk ${cls}" data-open="${b.id}" style="top:${top}px;height:${h}px">${tag}<b>${time}${b.status==='done'?' ✓':''}</b><div class="x">${esc(svcNames(b) || 'Запись')}</div>${h>60?`<div class="x">${esc([b.car, b.name].filter(Boolean).join(' · '))}</div>`:''}</div>`;
}

// ---------- карточка записи ----------
function openBooking(id){
  const b = findB(id); if (!b) return;
  if (isClient(b)) markSeen([id]);
  const when = b.start != null ? `${dateHuman(b.date)}, ${hm(b.start)}–${hm(b.start + b.dur)}` : `${dateHuman(b.date)} (желаемый день)`;
  const src = b.kind==='online' ? 'Онлайн-запись' : b.kind==='request' ? 'Заявка с сайта' : b.kind==='manual' ? 'Добавлена вами' : 'Закрытое время';
  const created = new Date(b.created_at);
  let body = '', foot = '';
  if (b.kind==='block'){
    body = `<div class="rows"><div class="r"><span>Когда</span><span>${when}</span></div><div class="r"><span>Бокс</span><span>${b.box==null?'Все боксы':'Бокс '+(b.box+1)}</span></div>${b.comment?`<div class="r"><span>Причина</span><span>${esc(b.comment)}</span></div>`:''}</div>`;
    foot = b.status==='cancelled' ? '' : `<button class="btn" data-act="move">Изменить</button><button class="btn dan" data-act="unblock">Открыть время</button>`;
  } else {
    body = (b.phone ? `<a class="call" href="${telHref(b.phone)}">${I.phone}Позвонить ${esc(b.phone)}</a>` : '') + `
      <div class="rows">
        <div class="r"><span>Когда</span><span>${when}</span></div>
        ${b.box!=null?`<div class="r"><span>Бокс</span><span>${b.box+1}</span></div>`:''}
        <div class="r"><span>Статус</span><span><span class="chip-st st-${b.status}" style="margin:0">${STATUS[b.status]}</span></span></div>
        ${b.services.length?`<div class="r"><span>Услуги</span><span>${esc(svcNames(b))}</span></div>`:''}
        <div class="r"><span>Сумма</span><span><b>${rub(b.total)}</b></span></div>
        ${b.car?`<div class="r"><span>Авто</span><span>${esc(b.car)}</span></div>`:''}
        ${b.name?`<div class="r"><span>Клиент</span><span>${esc(b.name)}</span></div>`:''}
        ${b.comment?`<div class="r"><span>Комментарий</span><span>${esc(b.comment)}</span></div>`:''}
        <div class="r"><span>Источник</span><span>${src} · ${created.getDate()} ${MON_RU[created.getMonth()]}, ${created.toTimeString().slice(0,5)}</span></div>
      </div>`;
    const acts = [];
    if (b.status==='new' && b.start!=null) acts.push(`<button class="btn pri" data-act="confirm">${I.check}Подтвердить</button>`);
    if (b.start==null && b.status!=='cancelled') acts.push(`<button class="btn pri" data-act="move">Назначить время</button>`);
    if (b.status==='confirmed') acts.push(`<button class="btn okb" data-act="done">${I.check}Выполнено</button>`, `<button class="btn" data-act="noshow">Не приехал</button>`);
    if (['new','confirmed'].includes(b.status) && b.start!=null) acts.push(`<button class="btn" data-act="move">Перенести</button>`);
    if (['new','confirmed'].includes(b.status)) acts.push(`<button class="btn dan" data-act="cancel">${b.status==='new'?'Отклонить':'Отменить'}</button>`);
    if (['done','noshow','cancelled'].includes(b.status) && b.start!=null) acts.push(`<button class="btn" data-act="restore">Вернуть в работу</button>`);
    foot = acts.join('');
  }
  openSheet(b.kind==='block' ? 'Закрытое время' : b.kind==='request' && b.start==null ? 'Заявка' : 'Запись', body, foot);
  $$('#sheet [data-act]').forEach(btn => btn.onclick = () => act(b, btn.dataset.act));
}
async function act(b, a){
  if (a==='move') return openMove(b);
  let body;
  if (a==='confirm' || a==='restore') body = {status:'confirmed'};
  else if (a==='done') body = {status:'done'};
  else if (a==='noshow') body = {status:'noshow'};
  else if (a==='unblock') body = {status:'cancelled'};
  else if (a==='cancel'){
    const msg = isClient(b) ? 'Отменить запись? Клиент увидит отмену на странице записи, но лучше позвоните ему и предупредите.' : 'Отменить запись?';
    if (!confirm(msg)) return; body = {status:'cancelled'};
  }
  const r = await api(`/bookings/${b.id}`, {method:'PATCH', body});
  if (!r.ok) return toast(r.data.message || 'Не получилось. Попробуйте ещё раз.');
  patchLocal(r.data); closeSheet(); refreshView();
  toast({confirmed: a==='restore' ? 'Запись снова в работе' : 'Запись подтверждена', done:'Отмечено: выполнено', noshow:'Отмечено: не приехал', cancelled: a==='unblock' ? 'Время снова открыто для записи' : 'Запись отменена'}[body.status]);
}

// ---------- выбор времени (перенос, назначение заявки) ----------
function durOptions(cur, open, close){
  const opts = [30,45,60,90,120,150,180,240,300,360,480,600,720].filter(m => m <= 1440);
  if (cur && !opts.includes(cur)) opts.push(cur);
  opts.sort((a,b)=>a-b);
  const full = open!=null ? close - open : null;
  return opts.map(m => `<option value="${m}" ${m===cur?'selected':''}>${durTxt(m)}${m===full?' (весь день)':''}</option>`).join('') + (full && !opts.includes(full) ? `<option value="${full}">${durTxt(full)} (весь день)</option>` : '');
}
function timeOptions(cur, from=6*60, to=23*60+30){
  let s = ''; for (let m = from; m <= to; m += 30) s += `<option value="${m}" ${m===cur?'selected':''}>${hm(m)}</option>`;
  if (cur != null && cur % 30) s = `<option value="${cur}" selected>${hm(cur)}</option>` + s;
  return s;
}
function dayOptions(cur, back=0){
  const t = today(); let s = '';
  for (let i = -back; i < 31; i++){ const k = addDays(t, i); s += `<option value="${k}" ${k===cur?'selected':''}>${dateHuman(k)}${dayHours(k)?'':' — выходной'}</option>`; }
  return s;
}
function boxSeg(cur, withAll){
  const n = S.cfg.boxes; let s = withAll ? `<button data-box="all" class="${cur==null?'on':''}">Все боксы</button>` : '';
  for (let i = 0; i < n; i++) s += `<button data-box="${i}" class="${cur===i?'on':''}">Бокс ${i+1}</button>`;
  return `<div class="seg" id="boxSeg">${s}</div>`;
}
function bindSeg(id, cb){ $$(`#${id} button`).forEach(b => b.onclick = () => { $$(`#${id} button`).forEach(x=>x.classList.remove('on')); b.classList.add('on'); cb(b); }); }
function openMove(b){
  const hh = dayHours(b.date) || [9*60, 21*60];
  const st = {date:b.date, start: b.start ?? hh[0], box: b.box ?? (b.kind==='block' ? null : 0), dur: b.dur || 120};
  const body = `<div id="mvErr"></div>
    <div class="field"><label>День</label><select id="mvDate">${dayOptions(st.date, 1)}</select></div>
    <label class="small" style="display:block;margin-bottom:6px">Бокс</label>${boxSeg(st.box, b.kind==='block')}
    <div class="two"><div class="field"><label>Начало</label><select id="mvStart">${timeOptions(st.start)}</select></div>
    <div class="field"><label>Длительность</label><select id="mvDur">${durOptions(st.dur, hh[0], hh[1])}</select></div></div>
    <div class="small">${b.kind!=='block' && isClient(b) ? 'Клиент увидит новое время на странице записи. Лучше позвоните и предупредите его.' : ''}</div>`;
  openSheet(b.start==null ? 'Назначить время' : 'Перенести', body, `<button class="btn" id="mvCancel">Назад</button><button class="btn pri" id="mvSave">Сохранить</button>`);
  bindSeg('boxSeg', x => st.box = x.dataset.box==='all' ? null : +x.dataset.box);
  $('#mvDate').onchange = e => st.date = e.target.value;
  $('#mvStart').onchange = e => st.start = +e.target.value;
  $('#mvDur').onchange = e => st.dur = +e.target.value;
  $('#mvCancel').onclick = () => openBooking(b.id);
  $('#mvSave').onclick = async () => {
    const body = {date:st.date, start:st.start, dur:st.dur, box:st.box};
    if (b.start == null) body.status = 'confirmed';
    let r = await api(`/bookings/${b.id}`, {method:'PATCH', body});
    if (r.status===409 && r.data.error==='overlap' && confirm('На это время в этом боксе уже есть запись. Всё равно поставить?')) r = await api(`/bookings/${b.id}`, {method:'PATCH', body:{...body, force:true}});
    if (!r.ok){ if (r.status !== 409) $('#mvErr').innerHTML = `<div class="err-box">${esc(r.data.message || 'Не получилось сохранить')}</div>`; return; }
    patchLocal(r.data); S.date = r.data.date; closeSheet(); refreshView(); toast('Время сохранено');
  };
}

// ---------- добавить запись / закрыть время ----------

    <div class="seg" id="modeSeg"><button data-m="manual" class="on">Запись клиента</button><button data-m="block">Закрыть время</button></div>

      <div class="field"><label>Сумма, ₽</label><input id="adTotal" inputmode="numeric" placeholder="0"></div>

      <div class="field"><label>Авто</label><input id="adCar" placeholder="Марка, номер"></div>

    </div>

      <div class="field"><label>Комментарий</label><input id="adReason" placeholder="Необязательно"></div>
      <button class="btn" id="adWholeDay" style="width:100%;margin-bottom:12px">Закрыть весь день</button>
    </div>`;
  openSheet('Добавить', body, `<button class="btn pri" id="adSave" style="flex-basis:100%">Добавить запись</button>`);
  const syncDur = () => { $('#adDur').innerHTML = durOptions(st.dur, ...(dayHours(st.date) || [null,null])); };
  bindSeg('modeSeg', x => { st.mode = x.dataset.m; $('#adManual').hidden = st.mode!=='manual'; $('#adBlock').hidden = st.mode!=='block';
    $('#adBox').innerHTML = boxSeg(st.mode==='block' ? null : (st.box ?? 0), st.mode==='block'); if (st.mode==='block') st.box = null; else if (st.box==null) st.box = 0;
    bindSeg('boxSeg', y => st.box = y.dataset.box==='all' ? null : +y.dataset.box);
    $('#adSave').textContent = st.mode==='block' ? 'Закрыть время' : 'Добавить запись'; });
  bindSeg('boxSeg', y => st.box = y.dataset.box==='all' ? null : +y.dataset.box);
  bindSeg('reasonSeg', x => st.reason = x.dataset.r);
  $('#adDate').onchange = e => { st.date = e.target.value; syncDur(); };
  $('#adStart').onchange = e => st.start = +e.target.value;
  $('#adDur').onchange = e => st.dur = +e.target.value;
  $('#adTotal').oninput = e => { st.totalTouched = true; st.total = parseInt(e.target.value.replace(/\D/g,'')) || 0; };

  $('#adSave').onclick = async () => {
    const body = st.mode==='block'
      ? {kind:'block', date:st.date, start:st.start, dur:st.dur, box:st.box, comment:[st.reason!=='Другое'?st.reason:'', $('#adReason').value.trim()].filter(Boolean).join(': ')}
      : {kind:'manual', date:st.date, start:st.start, dur:st.dur, box:st.box, services:st.sel, total:st.total, name:$('#adName').value.trim(),
         phone:$('#adPhone').value.replace(/\D/g,'').length>1 ? $('#adPhone').value : '', car:$('#adCar').value.trim(), comment:$('#adCom').value.trim()};
    let r = await api('/bookings', {method:'POST', body});
    if (r.status===409 && r.data.error==='overlap' && confirm(st.mode==='block' ? 'На это время уже есть записи. Всё равно закрыть? Записи останутся — им нужно будет позвонить.' : 'На это время в этом боксе уже есть запись. Всё равно добавить?'))
      r = await api('/bookings', {method:'POST', body:{...body, force:true}});
    if (!r.ok){ if (r.status !== 409) $('#adErr').innerHTML = `<div class="err-box">${esc(r.data.message || 'Не получилось сохранить')}</div>`; return; }
    S.data.bookings.push(r.data); S.known.add(r.data.id); S.date = r.data.date; closeSheet(); refreshView();
    toast(st.mode==='block' ? 'Время закрыто для онлайн-записи' : 'Запись добавлена');
  };
}

// ---------- заявки и записи, которые ждут подтверждения ----------
function reqView(v){
  const reqs = S.data.requests.filter(b => b.start==null && b.status==='new');
  const wait = S.data.bookings.filter(b => b.status==='new' && b.kind==='online' && b.start!=null);
  const card = b => `<div class="card">
    <div class="t">${b.start!=null ? dateHuman(b.date)+', '+hm(b.start) : 'Желаемый день: '+dateHuman(b.date)}</div>
    <div class="s">${esc(svcNames(b))} · ${rub(b.total)}</div>
    <div class="s">${esc([b.name, b.phone, b.car].filter(Boolean).join(' · '))}</div>
    ${b.comment?`<div class="s">«${esc(b.comment)}»</div>`:''}
    <div class="acts">${b.phone?`<a class="btn" href="${telHref(b.phone)}">${I.phone}Позвонить</a>`:''}
      ${b.start!=null?`<button class="btn pri" data-q="confirm" data-id="${b.id}">Подтвердить</button>`:`<button class="btn pri" data-q="move" data-id="${b.id}">Назначить время</button>`}
      <button class="btn dan" data-q="cancel" data-id="${b.id}">Отклонить</button></div></div>`;
  let html = '';
  if (!reqs.length && !wait.length) html = `<div class="empty">Новых заявок нет.<br><span class="small">Здесь появятся записи, которые ждут вашего подтверждения, и заявки на долгие работы (от 1 дня).</span></div>`;
  if (wait.length) html += `<div class="h2 pad">Ждут подтверждения</div>` + wait.map(card).join('');
  if (reqs.length) html += `<div class="h2 pad">Заявки на долгие работы</div><div class="hint" style="margin:-4px 16px 10px">Позвоните клиенту, договоритесь о времени и нажмите «Назначить время».</div>` + reqs.map(card).join('');
  v.innerHTML = html;
  v.querySelectorAll('[data-q]').forEach(btn => btn.onclick = () => act(findB(+btn.dataset.id), btn.dataset.q));
  markSeen(reqs.concat(wait).map(b => b.id));
}

// ---------- цены и услуги ----------
const DUR_LIST = [15,30,45,60,90,120,150,180,240,300,360,480,600,720];
const durShort = m => m<60 ? m+' мин' : Math.floor(m/60)+' ч'+(m%60 ? ' '+m%60 : '');
function priceView(v){
  if (!S.edit){ S.edit = JSON.parse(JSON.stringify(S.cfg.categories)); S.dirty = false; }
  const ed = S.edit;
  v.innerHTML = `${S.editErr?`<div class="err-box" style="margin:12px 16px 0">${esc(S.editErr)}</div>`:''}
    <div class="hint" style="margin-top:12px">Цены сразу появятся на странице записи. «Скрыта»: услуга пропадёт со страницы, но останется здесь. «Только по звонку»: клиент видит услугу и цену, но вместо записи ему предлагают позвонить вам.</div>` +
    ed.map((c,ci) => `<div class="cat-h"><input value="${esc(c.name)}" data-cat="${ci}" aria-label="Название раздела"></div>` +
      c.services.map((s,si) => `<div class="pe ${s.hidden?'hid':''}">
        <input class="nm" value="${esc(s.name)}" data-f="name" data-c="${ci}" data-s="${si}" aria-label="Название услуги">
        <div class="ln"><input class="pr" inputmode="numeric" value="${s.price}" data-f="price" data-c="${ci}" data-s="${si}" aria-label="Цена">
          <select class="du" data-f="dur" data-c="${ci}" data-s="${si}" aria-label="Длительность">${DUR_LIST.concat(DUR_LIST.includes(s.dur)||s.dur==='days'?[]:[s.dur]).map(m=>`<option value="${m}" ${s.dur===m?'selected':''}>${durShort(m)}</option>`).join('')}<option value="days" ${s.dur==='days'?'selected':''}>от 1 дня</option></select>
          <button class="tg ${s.hidden?'':'on'}" data-f="hidden" data-c="${ci}" data-s="${si}">${s.hidden?'Скрыта':'На сайте'}</button>
          <button class="del" data-f="del" data-c="${ci}" data-s="${si}" aria-label="Удалить">${I.trash}</button></div>
        <button class="mode ${s.call?'phone-only':''}" data-f="call" data-c="${ci}" data-s="${si}"><span>Запись: <b>${s.call?'только по звонку':'онлайн'}</b></span><span class="chg">сменить</span></button>
      </div>`).join('') + `<button class="add-row" data-addsvc="${ci}">+ Услуга в «${esc(c.name)}»</button>`).join('') +
    `<button class="add-row" id="addCat" style="margin-top:12px">+ Новый раздел</button><div style="height:80px"></div>`;
  // панель «Сохранить» появляется без перерисовки, чтобы не сбить ввод цены
  const showSave = () => {
    if (v.querySelector('.savebar')) return;
    v.insertAdjacentHTML('beforeend', `<div class="savebar"><div class="in"><button class="btn" id="edUndo">Отменить</button><button class="btn pri" id="edSave">Сохранить изменения</button></div></div>`);
    bindSave();
  };
  const dirty = () => { S.dirty = true; showSave(); };
  v.querySelectorAll('[data-cat]').forEach(inp => inp.oninput = () => { ed[+inp.dataset.cat].name = inp.value; dirty(); });
  v.querySelectorAll('.pe [data-f]').forEach(el => {
    const s = () => ed[+el.dataset.c].services[+el.dataset.s];
    const f = el.dataset.f;
    if (f==='name') el.oninput = () => { s().name = el.value; dirty(); };
    if (f==='price') el.oninput = () => { el.value = el.value.replace(/\D/g,''); s().price = parseInt(el.value) || 0; dirty(); };
    if (f==='dur') el.onchange = () => { s().dur = el.value==='days' ? 'days' : +el.value; dirty(); };
    if (f==='hidden') el.onclick = () => { s().hidden = !s().hidden; S.dirty = true; priceView(v); };
    if (f==='call') el.onclick = () => { s().call = !s().call; S.dirty = true; priceView(v); };
    if (f==='del') el.onclick = () => { if (!confirm(`Удалить услугу «${s().name}»? Лучше просто скрыть, если она может вернуться.`)) return; ed[+el.dataset.c].services.splice(+el.dataset.s, 1); S.dirty = true; priceView(v); };
  });
  v.querySelectorAll('[data-addsvc]').forEach(b => b.onclick = () => { ed[+b.dataset.addsvc].services.push({name:'Новая услуга', price:0, dur:60, hidden:false}); S.dirty = true; priceView(v); });
  $('#addCat').onclick = () => { ed.push({name:'Новый раздел', services:[{name:'Новая услуга', price:0, dur:60, hidden:false}]}); S.dirty = true; priceView(v); };
  if (S.dirty) showSave();
  function bindSave(){
  $('#edUndo').onclick = () => { S.edit = null; S.dirty = false; S.editErr = ''; priceView(v); };
  const sv = $('#edSave'); sv.onclick = async () => {
    const cats = ed.filter(c => c.services.length).map(c => ({...c, name: c.name.trim(), services: c.services.map(s => ({...s, name: s.name.trim()}))}));
    if (cats.some(c => !c.name || c.services.some(s => !s.name))){ S.editErr = 'У каждой услуги и раздела должно быть название.'; priceView(v); return; }
    sv.disabled = true; sv.innerHTML = '<span class="spin"></span>';
    const r = await api('/config', {method:'PUT', body:{categories:cats}});
    if (!r.ok){ S.editErr = r.data.message || 'Не получилось сохранить. Проверьте интернет.'; priceView(v); return; }
    S.cfg = r.data; S.edit = null; S.dirty = false; S.editErr = ''; priceView(v); toast('Цены сохранены — уже на странице записи');
  };
  }
}

// ---------- настройки ----------
function setView(v){
  const c = S.cfg;
  const client = location.origin + location.pathname.replace(/owner\/?(index\.html)?$/, '');
  const hours = JSON.parse(JSON.stringify(c.hours));
  const ua = navigator.userAgent, ios = /iphone|ipad|ipod/i.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  const doff = (c.daysOff||[]).filter(d => d >= today());
  v.innerHTML = `<div style="height:12px"></div>
    ${c.telegram_link ? `<div class="set"><h3>Уведомления в Telegram</h3><p>Нажмите кнопку — откроется Telegram. Там нажмите «Запустить». После этого о каждой новой записи будет приходить сообщение. Подключить можно несколько человек: каждому — нажать эту же кнопку.</p>
      <a class="btn pri" href="${esc(c.telegram_link)}" target="_blank" rel="noopener" style="width:100%">${I.tg}Подключить Telegram</a></div>`
      : DEMO ? `<div class="set"><h3>Уведомления в Telegram</h3><p>В рабочей версии здесь кнопка «Подключить Telegram»: одно нажатие, и о каждой новой записи приходит сообщение. Подключить можно несколько человек.</p></div>` : ''}
    <div class="set"><div class="line"><div class="grow"><h3>Подтверждать записи вручную</h3><p style="margin:0">${c.confirm ? 'Включено: новая запись ждёт, пока вы её подтвердите.' : 'Выключено: клиент записывается сразу, время занимается автоматически.'}</p></div><button class="sw ${c.confirm?'on':''}" id="swConfirm" aria-label="Подтверждать вручную"></button></div></div>
    <div class="set"><h3>Боксы</h3><p>Сколько машин можно обслуживать одновременно.</p><div class="stepper"><button id="bxMinus">−</button><b>${c.boxes}</b><button id="bxPlus">+</button></div></div>
    <div class="set"><h3>Часы работы</h3><p>По ним клиенты видят свободное время.</p>
      ${DOW_ORDER.map((d,i) => `<div class="hrow"><span class="dn">${DOW_ORDER_RU[i]}</span><button class="sw ${hours[d]?'on':''}" data-day="${d}"></button>
        ${hours[d] ? `<select data-h="${d}" data-i="0">${timeOptions(toMin(hours[d][0]), 0, 23*60+30)}</select><span>–</span><select data-h="${d}" data-i="1">${timeOptions(toMin(hours[d][1]), 30, 24*60-30)}</select>` : `<span class="cl">выходной</span>`}</div>`).join('')}
      <button class="btn pri" id="saveHours" style="width:100%;margin-top:12px" hidden>Сохранить часы работы</button></div>
    <div class="set"><h3>Выходные и праздники</h3><p>В эти дни онлайн-запись закрыта.</p>
      <div class="doff">${doff.length ? doff.map(d => `<span>${dateHuman(d)}<button data-rm="${d}" aria-label="Убрать">${I.close}</button></span>`).join('') : '<span class="small" style="background:none;border:0;padding:0">Пока нет</span>'}</div>
      <div class="line"><select id="doffSel" class="grow" style="background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px">${dayOptions(addDays(today(),1))}</select><button class="btn" id="doffAdd" style="flex:0 0 auto;min-width:0">Добавить</button></div></div>
    <div class="set"><h3>Страница записи для клиентов</h3><p>Эту ссылку можно ставить в Яндекс Картах, 2ГИС, ВКонтакте и Telegram.</p>
      <div class="small" style="word-break:break-all;margin-bottom:10px">${esc(client)}</div>
      <div class="line"><a class="btn" href="${esc(client)}" target="_blank" rel="noopener">Открыть</a><button class="btn" id="copyLink">Скопировать</button></div></div>
    <div class="set"><h3>Кабинет на экране телефона</h3><p>Чтобы открывать кабинет одной кнопкой, как приложение:</p>
      <ol class="howto">${ios ? '<li>Нажмите «Поделиться» (квадрат со стрелкой) внизу Safari.</li><li>Выберите «На экран Домой».</li><li>Нажмите «Добавить».</li>' : '<li>Нажмите три точки в правом верхнем углу браузера.</li><li>Выберите «Добавить на главный экран» или «Установить приложение».</li><li>Подтвердите.</li>'}</ol></div>
    ${DEMO ? `<div class="set"><h3>Начать демо заново</h3><p>Вернуть исходное расписание и цены, как при первом открытии.</p><button class="btn" id="logout" style="width:100%">Сбросить демо</button></div>`
      : `<div class="set"><h3>Выйти на этом телефоне</h3><p>Чтобы снова войти, понадобится личная ссылка.</p><button class="btn dan" id="logout" style="width:100%">Выйти</button></div>`}
    <div class="hint" style="text-align:center;margin-bottom:20px">${esc(D.name)} · онлайн-запись</div>`;
  const put = async (body, msg) => { const r = await api('/config', {method:'PUT', body}); if (!r.ok){ toast(r.data.message || 'Не получилось сохранить'); return false; } S.cfg = r.data; setView(v); toast(msg); return true; };
  $('#swConfirm').onclick = () => put({confirm: !c.confirm}, !c.confirm ? 'Теперь записи ждут вашего подтверждения' : 'Клиенты снова записываются сразу');
  $('#bxMinus').onclick = () => c.boxes > 1 && put({boxes: c.boxes - 1}, 'Боксов: ' + (c.boxes - 1));
  $('#bxPlus').onclick = () => c.boxes < 20 && put({boxes: c.boxes + 1}, 'Боксов: ' + (c.boxes + 1));
  const showSave = () => $('#saveHours').hidden = false;
  v.querySelectorAll('[data-day]').forEach(b => b.onclick = () => {
    const d = b.dataset.day; hours[d] = hours[d] ? null : ['09:00','21:00'];
    const row = b.parentElement; b.classList.toggle('on', !!hours[d]);
    row.querySelectorAll('select,span:not(.dn),.cl').forEach(x => x.remove());
    if (hours[d]) row.insertAdjacentHTML('beforeend', `<select data-h="${d}" data-i="0">${timeOptions(540, 0, 23*60+30)}</select><span>–</span><select data-h="${d}" data-i="1">${timeOptions(1260, 30, 24*60-30)}</select>`);
    else row.insertAdjacentHTML('beforeend', `<span class="cl">выходной</span>`);
    row.querySelectorAll('select').forEach(bindHour); showSave();
  });
  function bindHour(sel){ sel.onchange = () => { hours[sel.dataset.h][+sel.dataset.i] = hm(+sel.value); showSave(); }; }
  v.querySelectorAll('[data-h]').forEach(bindHour);
  $('#saveHours').onclick = () => {
    for (const d of DOW_ORDER) if (hours[d] && toMin(hours[d][0]) >= toMin(hours[d][1])){ toast('Время закрытия должно быть позже открытия'); return; }
    put({hours}, 'Часы работы сохранены');
  };
  v.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => put({daysOff:(c.daysOff||[]).filter(x => x!==b.dataset.rm)}, 'Выходной убран'));
  $('#doffAdd').onclick = () => { const d = $('#doffSel').value; if ((c.daysOff||[]).includes(d)) return toast('Этот день уже выходной');
    const busy = S.data.bookings.filter(b => b.date===d && b.status!=='cancelled' && b.kind!=='block').length;
    if (busy && !confirm(`На этот день уже ${busy} ${plural(busy,'запись','записи','записей')}. Они останутся — клиентам нужно будет позвонить. Сделать день выходным?`)) return;
    put({daysOff:(c.daysOff||[]).concat(d)}, 'Выходной добавлен'); };
  $('#copyLink').onclick = async () => { try{ await navigator.clipboard.writeText(client); toast('Ссылка скопирована'); }catch(e){ prompt('Скопируйте ссылку:', client); } };
  $('#logout').onclick = () => { if (DEMO){ if (window.__zapisDemoReset) window.__zapisDemoReset(); location.reload(); return; }
    if (!confirm('Выйти из кабинета на этом телефоне?')) return; try{ localStorage.removeItem(KEYK); }catch(e){} KEY = null; S.auth = false; render(); };
}

// ---------- окно снизу и всплывашки ----------
function openSheet(title, body, foot){
  $('#sheet').innerHTML = `<div class="sh-head"><h2>${title}</h2><button class="icon-btn" id="shClose" aria-label="Закрыть">${I.close}</button></div><div class="sh-body">${body}</div>${foot ? `<div class="sh-foot">${foot}</div>` : ''}`;
  $('#sheet').classList.add('on'); $('#sheetBg').classList.add('on'); document.body.style.overflow = 'hidden';
  $('#shClose').onclick = closeSheet;
}
function closeSheet(){ $('#sheet').classList.remove('on'); $('#sheetBg').classList.remove('on'); document.body.style.overflow = ''; }
$('#sheetBg').onclick = closeSheet;
function toast(m, ms=2600, cls=''){ const t = $('#toast'); t.textContent = m; t.className = 'toast on ' + cls; clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', ms); }

// ---------- старт ----------
render();
if (S.auth){
  (async () => { const ok = await loadCfg(); if (!ok && S.auth){ S.online = false; } await load(); })();
  setInterval(() => { if (!document.hidden && S.auth) load(); }, 20000);
  setInterval(() => { if (!document.hidden && S.auth && !S.dirty) loadCfg(); }, 300000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.auth){ load(); } });
  window.addEventListener('online', () => S.auth && load());
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
