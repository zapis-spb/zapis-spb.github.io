<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Aqua Buro — онлайн-запись</title>
<meta name="theme-color" content="#0E1014">
<!-- страница уже тёмная: браузеры с «тёмным режимом» (Samsung Internet, Chrome) не должны её перекрашивать -->
<meta name="color-scheme" content="dark">
<meta name="darkreader-lock">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aqua Buro">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- шрифт грузится в фоне: если Google в России тормозит, страница всё равно сразу открывается системным шрифтом -->
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  color-scheme:dark;
  --bg:#0E1014; --bg2:#15181E; --card:#1A1E25; --line:#262B34; --text:#F2F4F7; --muted:#9AA3B2; --dim:#6B7380;
  --accent:#00A2C7; --accent-ink:#fff; --ok:#3DD68C; --warn:#F5B84B; --danger:#FF6B6B;
  --r:16px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100dvh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
.wrap{max-width:560px;margin:0 auto;position:relative}
.demo-bar{background:#22262E;color:var(--muted);font-size:12px;padding:8px 16px;text-align:center;border-bottom:1px solid var(--line)}
.demo-bar b{color:var(--text);font-weight:600}

/* hero */
.hero{position:relative;height:300px;overflow:hidden}
.hero-track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.hero-track::-webkit-scrollbar{display:none}
.hero-track{transition:opacity .2s}
.hero-track img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start;scroll-snap-stop:always;background:#1b1f26}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,16,20,.15) 0%,rgba(14,16,20,0) 35%,rgba(14,16,20,.92) 100%);pointer-events:none}
.dots{position:absolute;right:16px;top:14px;display:flex;gap:5px;z-index:2;padding:6px 8px;border-radius:999px;background:rgba(0,0,0,.35)}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.4);transition:.2s}
.dots i.on{width:18px;background:#fff}
.hero-info{position:absolute;left:16px;right:16px;bottom:16px;z-index:2}
.kind{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:4px 0 6px;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:#C9CFD8}
.meta span{display:inline-flex;align-items:center;gap:5px}
.star{color:#FFC94D}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 16px 4px}
.qa{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-weight:600}
.qa svg{width:20px;height:20px;color:var(--text)}
.open-now{margin:10px 16px 0;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.open-now .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(61,214,140,.15)}
.open-now.closed .dot{background:var(--dim);box-shadow:none}

/* catalog */
.section-title{padding:22px 16px 8px;font-size:20px;font-weight:800;letter-spacing:-.01em}
.chips{position:sticky;top:0;z-index:5;background:rgba(14,16,20,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;border-bottom:1px solid transparent}
.chips.stuck{border-bottom-color:var(--line)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip .cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800}
.cat{padding:0 16px 4px}
.cat-h{display:inline-flex;align-items:baseline;gap:8px;margin:20px 0 10px -10px;padding:4px 10px;border-radius:10px;font-size:18px;font-weight:800;letter-spacing:-.01em}
.cat-h .n{font-size:13px;font-weight:600;color:var(--dim)}
.cat-h.flash{animation:catFlash 1.4s ease-out}
@keyframes catFlash{0%,35%{background:color-mix(in srgb,var(--accent) 28%,transparent);color:var(--accent)}100%{background:transparent;color:var(--text)}}
.hero-nav{position:absolute;top:42%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:none;place-items:center;z-index:3;backdrop-filter:blur(6px)}
.hero-nav svg{width:20px;height:20px}
.hero-nav.l{left:12px}.hero-nav.r{right:12px}
@media (hover:hover) and (pointer:fine){.hero-nav{display:grid}.hero-track,.chips,.days{cursor:grab}}
.dragging{cursor:grabbing!important;scroll-snap-type:none!important;user-select:none}
.dots i{cursor:pointer}
.svc{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:8px;transition:border-color .15s,background .15s}
.svc.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--card))}
.svc .body{flex:1;min-width:0}
.svc .nm{font-weight:700;font-size:15px}
.svc .ds{color:var(--muted);font-size:13px;margin-top:3px}
.svc .row{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:13px;color:var(--dim)}
.svc .pr{color:var(--text);font-weight:700;font-size:15px}
.add{flex:0 0 auto;width:36px;height:36px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;transition:.15s}
.svc.call .add{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.svc.call .add svg{width:18px;height:18px}
.svc .row .bycall{color:var(--accent);font-weight:600}
.add svg{width:18px;height:18px}
.svc.sel .add{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.note{color:var(--dim);font-size:12px;padding:8px 16px 0}
.info-card{margin:8px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.info-card .r{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px}
.info-card .r span:first-child{color:var(--muted)}
footer{padding:28px 16px calc(120px + var(--safe-b));color:var(--dim);font-size:12px;text-align:center}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(12px + var(--safe-b));background:linear-gradient(180deg,rgba(14,16,20,0),rgba(14,16,20,.96) 30%);pointer-events:none}
.bar .in{max-width:528px;margin:0 auto;pointer-events:auto}
.cta{width:100%;height:56px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;box-shadow:0 10px 30px -10px color-mix(in srgb,var(--accent) 70%,transparent);transition:transform .1s,opacity .2s}
.cta:active{transform:scale(.985)}
.cta[disabled]{opacity:.45;box-shadow:none}
.cta .sub{font-weight:600;font-size:13px;opacity:.85}
.cta.center{justify-content:center}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:94dvh;display:flex;flex-direction:column;background:var(--bg2);border-radius:22px 22px 0 0;transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto;border-top:1px solid var(--line)}
.sheet.on{transform:none}
.sh-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.sh-head h2{font-size:18px;margin:0;flex:1;font-weight:800}
.icon-btn{width:36px;height:36px;border-radius:12px;background:var(--card);display:grid;place-items:center;border:1px solid var(--line)}
.icon-btn svg{width:18px;height:18px}
.steps{display:flex;gap:6px;padding:0 16px 8px}
.steps i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.sh-body{overflow-y:auto;padding:4px 16px 16px;flex:1}
.sh-foot{padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--line)}
.summary{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.summary .l{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.summary .l span:first-child{color:var(--muted)}
.summary .l span:last-child{white-space:nowrap}
.label{font-size:13px;color:var(--muted);font-weight:600;margin:14px 0 8px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:58px;padding:9px 0;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:center}
.day .w{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
.day .d{font-size:18px;font-weight:800;margin-top:2px}
.day.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day.on .w{color:inherit;opacity:.85}
.day.off{opacity:.35}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.time{padding:11px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center;font-weight:700;font-size:14px}
.time.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.time[disabled]{opacity:.28;text-decoration:line-through}
.period{grid-column:1/-1;font-size:12px;color:var(--dim);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.empty{padding:22px;text-align:center;color:var(--muted);background:var(--card);border-radius:14px;border:1px dashed var(--line)}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}
.field input,.field textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:16px;outline:none;transition:border-color .15s}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field .err{color:var(--danger);font-size:12px;margin-top:5px;display:none}
.field.bad input{border-color:var(--danger)}
.field.bad .err{display:block}
.agree{font-size:12px;color:var(--dim);margin-top:6px}
.done{text-align:center;padding:24px 8px 8px}
.done .ok{width:72px;height:72px;border-radius:50%;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);display:grid;place-items:center;margin:0 auto 14px}
.done .ok svg{width:36px;height:36px}
.done h3{font-size:22px;margin:0 0 6px;font-weight:800}
.done p{color:var(--muted);margin:0 0 16px}
.ghost{width:100%;height:50px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:700;margin-top:8px}
.install{margin:16px 16px 0;width:calc(100% - 32px);padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);display:flex;gap:12px;align-items:center;font-size:13px;color:var(--muted);text-align:left}
.install>div{flex:1}
.install b{color:var(--text);font-size:14px}
.install svg{flex:0 0 22px;height:22px;color:var(--accent)}
.install .go{transform:scaleX(-1);display:grid}.install .go svg{color:var(--dim);flex:0 0 18px;width:18px;height:18px}
.howto{list-style:none;margin:0;padding:0;counter-reset:s}
.howto li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:10px 0;font-size:15px}
.howto li::before{content:counter(s);flex:0 0 28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:14px}
.howto b{font-weight:800}
.howto-warn{background:color-mix(in srgb,var(--warn) 12%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:12px}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,calc(-100% - 40px));background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:50;font-size:14px;transition:transform .3s;max-width:90vw}
.toast.on{transform:translate(-50%,0)}

/* рабочая версия: «Ваши записи», ошибки, загрузка */
.mine-card{margin:0 16px 8px;background:var(--card);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:var(--r);padding:14px}
.mine-card .t{font-weight:800;font-size:16px}
.mine-card .s{color:var(--muted);font-size:13px;margin-top:3px}
.mine-card .stt{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.mine-card .stt.new{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.mine-card .acts{display:flex;gap:8px;margin-top:12px}
.mini{flex:1;height:40px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-weight:700;font-size:14px;display:grid;place-items:center}
.mini.danger{color:var(--danger)}
.send-err{background:color-mix(in srgb,var(--danger) 12%,var(--card));border:1px solid color-mix(in srgb,var(--danger) 40%,var(--line));border-radius:14px;padding:12px 14px;font-size:14px;margin:0 0 12px}
.send-err a{text-decoration:underline;font-weight:700}
.send-err .acts{display:flex;gap:8px;margin-top:10px}
.loading{display:flex;align-items:center;justify-content:center;gap:10px}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:0 0 18px}
@keyframes spin{to{transform:rotate(360deg)}}
.day.full .d{opacity:.45}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.agree a{text-decoration:underline}

/* owner */
.owner{padding:0 16px calc(40px + var(--safe-b))}
.owner .tabs{display:flex;gap:8px;margin:12px 0}
.owner .tab{flex:1;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px}
.owner .tab.on{background:var(--text);color:var(--bg)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .v{font-size:20px;font-weight:800}
.kpi .k{font-size:12px;color:var(--muted)}
.tl{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;overflow-x:auto}
.tl-grid{display:grid;gap:6px;min-width:100%}
.tl-row{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:stretch}
.tl-h{font-size:12px;color:var(--dim);padding-top:6px}
.tl-boxes{display:grid;gap:6px}
.slot{min-height:30px;border-radius:8px;background:var(--bg2);font-size:12px;padding:6px 8px;color:var(--dim)}
.slot.busy{background:color-mix(in srgb,var(--accent) 22%,var(--bg2));color:var(--text)}
.slot.mine{background:var(--accent);color:var(--accent-ink);font-weight:700}
.bk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.bk .t{font-weight:800}
.bk .s{color:var(--muted);font-size:13px;margin-top:2px}
.pedit{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.pedit .n{flex:1;font-size:14px}
.pedit input{width:96px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:right;font-weight:700}
.pedit .pcall{flex:0 0 auto;height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--muted);font-size:12px;font-weight:700}
.pedit .pcall.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.owner-note{font-size:12px;color:var(--dim);margin:10px 0 0}
@media (min-width:600px){.hero{height:360px;border-radius:0 0 22px 22px}}

/* ---- лёгкая полировка: цветной фон, глубина карточек, акцент в деталях ---- */
body{background:
  radial-gradient(130% 55% at 50% 0%, color-mix(in srgb,var(--accent) 17%,transparent) 0%, transparent 62%),
  radial-gradient(90% 45% at 105% 55%, color-mix(in srgb,var(--accent) 8%,transparent) 0%, transparent 70%),
  radial-gradient(80% 40% at -10% 85%, color-mix(in srgb,var(--accent) 6%,transparent) 0%, transparent 70%),
  var(--bg);background-attachment:fixed}
.demo-bar{background:color-mix(in srgb,var(--accent) 14%,#14171C);border-bottom-color:color-mix(in srgb,var(--accent) 25%,var(--line));display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left}
.demo-bar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.demo-bar a{flex:0 0 auto;color:var(--text);font-weight:700;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--accent) 30%,transparent)}
/* текст на фото читается при любой картинке */
.hero::after{background:linear-gradient(180deg,rgba(14,16,20,.28) 0%,rgba(14,16,20,0) 28%,rgba(14,16,20,.5) 58%,rgba(14,16,20,.97) 100%)}
.kind{display:inline-block;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 30%,rgba(10,12,16,.55));color:#fff;letter-spacing:.06em;font-size:11px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
h1,.meta{text-shadow:0 2px 14px rgba(0,0,0,.55)}
/* карточки: мягкий блик сверху и тень */
.svc,.info-card,.summary,.install,.qa,.day,.time{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,0) 60%),var(--card);border-color:rgba(255,255,255,.075)}
.svc,.info-card,.install{border-radius:18px;box-shadow:0 10px 28px -20px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.04)}
.svc.sel{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 16%,transparent),color-mix(in srgb,var(--accent) 6%,transparent)),var(--card);border-color:var(--accent)}
.add{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg2));border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.svc.sel .add{color:var(--accent-ink)}
/* быстрые действия: иконки в цвет мойки */
.qa{color:#C9CFD8}
.qa svg{color:var(--accent)}
/* заголовки и разделы */
.section-title::before{content:"";display:inline-block;width:4px;height:18px;border-radius:2px;background:var(--accent);margin-right:10px;vertical-align:-2px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on .cnt{background:#fff;color:#111}
/* главная кнопка с лёгким градиентом */
.cta{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent) 45%,color-mix(in srgb,var(--accent) 82%,#000))}
.cta[disabled]{background:var(--accent)}
.day.on,.time.on{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));border-color:var(--accent)}

// перетаскивание мышью для горизонтальных лент (на телефоне работает родной свайп)
function dragScroll(el, opts={}){
  if (!el || el._drag) return; el._drag = true;
  let down=false, sx=0, sl=0, moved=false;
  el.addEventListener('pointerdown', e=>{ if (e.pointerType!=='mouse' || e.button!==0) return; down=true; moved=false; sx=e.clientX; sl=el.scrollLeft; });
  el.addEventListener('pointermove', e=>{ if (!down) return; const dx=e.clientX-sx; if (!moved && Math.abs(dx)>5){ moved=true; el.classList.add('dragging'); try{el.setPointerCapture(e.pointerId)}catch(_){} } if (moved) el.scrollLeft = sl-dx; });
  const end = e=>{ if (!down) return; down=false; if (!moved) return;
    const dx = e.clientX-sx;
    if (opts.page){ const w=el.clientWidth, cur=Math.round(sl/w), max=Math.round((el.scrollWidth-w)/w); let to=cur; if (Math.abs(dx)>40) to = cur + (dx<0?1:-1); to=Math.max(0,Math.min(max,to)); el.scrollTo({left:to*w,behavior:'smooth'}); setTimeout(()=>el.classList.remove('dragging'),400); }
    else el.classList.remove('dragging');
  };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.addEventListener('click', e=>{ if (moved){ e.stopPropagation(); e.preventDefault(); moved=false; } }, true);
  el.addEventListener('dragstart', e=>e.preventDefault());
}
// автолистание фото: пауза, пока человек трогает ленту или открыта запись
let heroTimer = null;
function startAutoplay(track){
  clearInterval(heroTimer);
  if (track.children.length < 2 || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let lastTouch = 0, hover = false;
  const hero = track.parentElement, touched = () => { lastTouch = Date.now(); };
  ['pointerdown','touchstart','touchmove','wheel'].forEach(ev => hero.addEventListener(ev, touched, {passive:true}));
  hero.addEventListener('click', touched);
  hero.addEventListener('pointerenter', e => { if (e.pointerType==='mouse') hover = true; });
  hero.addEventListener('pointerleave', e => { if (e.pointerType==='mouse') hover = false; });
  heroTimer = setInterval(() => {
    if (!track.isConnected){ clearInterval(heroTimer); return; }
    if (document.hidden || hover || Date.now()-lastTouch < 6000 || $('#sheet').classList.contains('on')) return;
    const w = track.clientWidth, n = track.children.length, i = Math.round(track.scrollLeft/w);
    if (i+1 < n){ track.scrollTo({left:(i+1)*w, behavior:'smooth'}); return; }
    track.style.opacity = 0;   // с последнего фото на первое — через затухание, без перемотки
    setTimeout(() => { track.scrollTo({left:0, behavior:'auto'}); track.style.opacity = 1; }, 220);
  }, 3000);
}

// ---------- рабочая версия: обмен с сервером ----------
async function api(path, opts={}){
  const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), opts.timeout||15000);
  try{
    const r = await fetch(API+path, {method: opts.method||'GET', cache:'no-store', signal: ctl.signal,
      headers: opts.body ? {'Content-Type':'application/json'} : {}, body: opts.body ? JSON.stringify(opts.body) : undefined});
    let data = {}; try{ data = await r.json(); }catch(e){}
    return {ok: r.ok, status: r.status, data: data || {}};
  }catch(e){ return {ok:false, status:0, data:{error:'network'}}; }
  finally{ clearTimeout(tm); }
}

const avail = {key:'', status:'idle', data:null, at:0};
const selKey = () => st.sel.slice().sort().join(',');
function dayInfo(k){ return avail.data && avail.data._key===selKey() ? avail.data.days.find(x=>x.date===k) : null; }
const todayKey = () => LIVE && avail.data ? avail.data.now.slice(0,10) : ymd(new Date());
// выбранный день должен быть днём со свободным временем; выбранное время — всё ещё свободным
function ensureDate(){
  if (!avail.data || avail.data._key!==selKey()) return;
  const okDay = d => d.open && (avail.data.request || d.times.length);
  if (!st.date || !avail.data.days.some(d=>d.date===st.date && okDay(d))){ const f = avail.data.days.find(okDay); st.date = f ? f.date : null; st.time = null; }
  if (st.time && !freeSlots(st.date).some(x=>x.t===st.time.t)) st.time = null;
}
async function loadAvail(force){
  const key = selKey(); if (!key) return;
  if (!force && avail.key===key && avail.status==='ok' && Date.now()-avail.at < 60000){ ensureDate(); if (sheetOpen() && st.step===1) renderSheet(); return; }
  avail.key = key; avail.status = 'loading'; ensureDate();
  if (sheetOpen() && st.step===1) renderSheet();
  const r = await api('/availability?days=14&services='+encodeURIComponent(key));
  if (key !== selKey()) return;
  if (r.ok){
    avail.data = {...r.data, _key:key}; avail.status = 'ok'; avail.at = Date.now(); ensureDate();
  } else {
    avail.status = 'error'; avail.errMsg = r.status===423 ? r.data.message : '';
    if (r.data.error==='service_changed' || r.data.error==='call_only'){ toast(r.data.message); await refreshConfig(true); closeSheet(); return; }
  }
  if (sheetOpen() && st.step===1) renderSheet();
}
function gridTimes(k){
  if (!LIVE){ const d=new Date(k+'T00:00'); const hh=hoursOf(d); const all=[]; if(!hh) return all; for(let t=hh[0]; t+selDur()<=hh[1]; t+=STEP) all.push(t); return all; }
  const x = dayInfo(k); if (!x || !x.hours) return [];
  const o = toMin(x.hours[0]), c = toMin(x.hours[1]), dur = avail.data.dur, all = [];
  const minT = k===todayKey() ? toMin(avail.data.now.slice(11,16)) + 30 : -1;
  for (let t=o; t+dur<=c; t+=STEP) if (t >= minT) all.push(t);
  return all;
}

// файл для календаря телефона: событие с напоминанием за 2 часа
function icsFor(b){
  const pad = n=>String(n).padStart(2,'0'); const [y,m,d] = b.date.split('-').map(Number);
  const s = new Date(Date.UTC(y, m-1, d, 0, b.start - 180)), e = new Date(s.getTime() + (b.dur||60)*60000);
  const f = x => x.getUTCFullYear()+pad(x.getUTCMonth()+1)+pad(x.getUTCDate())+'T'+pad(x.getUTCHours())+pad(x.getUTCMinutes())+'00Z';
  const q = v => String(v).replace(/[\\;,]/g, c=>'\\'+c).replace(/\n/g,'\\n');
  const tel = D.phones[0] ? fmtPhone(D.phones[0].value) : '';
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//zapis//RU','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT',
    'UID:'+b.id+'-'+D.slug+'@zapis','DTSTAMP:'+f(new Date()),'DTSTART:'+f(s),'DTEND:'+f(e),
    'SUMMARY:'+q(D.name+': '+b.services.map(x=>x.name).join(', ')),'LOCATION:'+q(D.address),
    'DESCRIPTION:'+q('Телефон: '+tel+'\nОтменить запись можно на странице записи.'),
    'BEGIN:VALARM','TRIGGER:-PT2H','ACTION:DISPLAY','DESCRIPTION:'+q('Запись: '+D.name),'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
}
function addToCalendar(b){

  const a = document.createElement('a'); a.href = url; a.download = 'zapis-'+b.date+'.ics'; document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 15000);
}

  const e = r.data.error;
  if (e==='slot_taken' || e==='day_closed'){ st.idem = null; st.time = null; st.step = 1; toast(r.data.message || 'Это время уже заняли'); renderSheet(); loadAvail(true); return; }
  if (e==='service_changed' || e==='call_only'){ st.idem = null; toast(r.data.message); await refreshConfig(true); closeSheet(); return; }
  st.sendErr = r.status===0 ? 'Нет связи с сервером. Проверьте интернет и нажмите ещё раз — запись не задвоится.' : (r.data.message || 'Не получилось записаться.');
  renderSheet();
}

function maskPhone(v){ let d=v.replace(/\D/g,''); if(d.startsWith('8')) d='7'+d.slice(1); if(!d.startsWith('7')) d='7'+d; d=d.slice(0,11); let r='+7'; if(d.length>1) r+=' ('+d.slice(1,4); if(d.length>=4) r+=') '+d.slice(4,7); if(d.length>=7) r+='-'+d.slice(7,9); if(d.length>=9) r+='-'+d.slice(9,11); return r; }
function dateHuman(k){ const d=new Date(k+'T00:00'); const t=ymd(new Date()); const tm=new Date(); tm.setDate(tm.getDate()+1); const pre = k===t?'Сегодня, ':k===ymd(tm)?'Завтра, ':''; return pre + d.getDate()+' '+MON_RU[d.getMonth()]+(pre?'':', '+DOW_RU[d.getDay()].toLowerCase()); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2200); }

// install prompt
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault(); deferred=e;});
window.addEventListener('appinstalled',()=>{deferred=null; const b=$('#install'); if(b) b.remove(); toast('Приложение добавлено на экран');});
function setupInstall(){
  const box=$('#install'); if(!box) return;
  if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone){ box.remove(); return; }
  box.onclick=async()=>{
    if (deferred){ const p=deferred; deferred=null; p.prompt(); const r=await p.userChoice.catch(()=>null); if(r&&r.outcome==='accepted') return; return; }
    openInstallHelp();
  };
}
// браузер не всегда разрешает установку по кнопке (iPhone — никогда), поэтому показываем шаги под устройство
function openInstallHelp(){
  const ua=navigator.userAgent;
  const ios=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const android=/android/i.test(ua);
  const inApp=!!window.TelegramWebview||!!window.TelegramWebviewProxy||/Telegram|VKAndroid|VKClient|com\.vk|Instagram|FBAN|FBAV|; wv\)/i.test(ua);
  const ya=/YaBrowser|YaApp/i.test(ua);
  let steps;
  if (ios) steps=['Нажмите кнопку <b>«Поделиться»</b> (квадрат со стрелкой вверх) на панели браузера','Пролистайте список вниз и выберите <b>«На экран Домой»</b>','Нажмите <b>«Добавить»</b> в правом верхнем углу'];
  else if (android) steps=[ya?'Нажмите <b>меню</b> браузера (три полоски или три точки)':'Нажмите <b>три точки</b> в правом верхнем углу браузера','Выберите <b>«Добавить на главный экран»</b> или <b>«Установить приложение»</b>','Подтвердите, нажав <b>«Добавить»</b> или <b>«Установить»</b>'];
  else steps=['Нажмите <b>три точки</b> в правом верхнем углу браузера','Выберите <b>«Трансляция, сохранение и отправка»</b>, затем <b>«Установить страницу как приложение»</b>','Подтвердите установку'];
  const warn=inApp?`<div class="howto-warn">Страница открыта внутри другого приложения, отсюда добавить нельзя. Сначала откройте меню (три точки) и выберите <b>«Открыть в браузере»</b>, а затем выполните шаги ниже.</div>`:'';
  $('#sheet').innerHTML=`<div class="sh-head"><h2>Как добавить на экран</h2><button class="icon-btn" id="close" aria-label="Закрыть">${I.close}</button></div>
    <div class="sh-body">${warn}<ol class="howto">${steps.map(s=>`<li><span>${s}</span></li>`).join('')}</ol></div>
    <div class="sh-foot"><button class="cta center" id="gotIt">Понятно</button></div>`;
  $('#close').onclick=closeSheet; $('#gotIt').onclick=closeSheet;
  $('#sheet').classList.add('on'); $('#sheetBg').classList.add('on'); document.body.style.overflow='hidden';
}
